<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#eefdf1}.muted{fill:#95b9b7}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#process-mobile-dark-5-neon)}.panel{fill:#0c171b;stroke:#173c30;stroke-width:1}.panelKey{fill:#0c171b;stroke:#56e6a3;stroke-width:1.2}.wire{fill:none;stroke:#173c30;stroke-width:1.2}.wireA{fill:none;stroke:url(#process-mobile-dark-5-neon);stroke-width:1.6}.flow{fill:none;stroke:#56e6a3;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#6adee7;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#56e6a3}.warn{fill:#6adee7}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
