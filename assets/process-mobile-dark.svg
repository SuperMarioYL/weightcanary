<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="process-mobile-dark-title process-mobile-dark-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
