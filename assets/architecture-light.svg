<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="architecture-light-title architecture-light-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="architecture-light-title">WeightCanary 架构</title><desc id="architecture-light-desc">三个 registry 源进入单进程二进制的 poller/state/report；diff 与 notify 属于 m2。</desc>
<defs><linearGradient id="architecture-light-a-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#31825c"/><stop offset=".5" stop-color="#3c7d83"/><stop offset="1" stop-color="#577c5e"/></linearGradient>
<radialGradient id="architecture-light-a-haze"><stop stop-color="#31825c" stop-opacity=".14"/><stop offset="1" stop-color="#f9fefc" stop-opacity="0"/></radialGradient>
<filter id="architecture-light-a-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="architecture-light-a-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7e3" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="architecture-light-a-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#3c7d83" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#132a26}.muted{fill:#557a7a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#architecture-light-a-neon)}.panel{fill:#f7fefa;stroke:#cbf7e3;stroke-width:1}.panelKey{fill:#f7fefa;stroke:#31825c;stroke-width:1.2}.wire{fill:none;stroke:#cbf7e3;stroke-width:1.2}.wireA{fill:none;stroke:url(#architecture-light-a-neon);stroke-width:1.6}.flow{fill:none;stroke:#31825c;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#3c7d83;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#31825c}.warn{fill:#3c7d83}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="1000" height="430" fill="#f9fefc"/><rect width="1000" height="430" fill="url(#architecture-light-a-grid)"/>
<g><rect x="36" y="64" width="180" height="66" rx="9" class="panel"/><text x="52" y="90" font-size="15">Hugging Face</text><text x="52" y="111" font-size="12" class="mono muted">huggingface.co</text><circle cx="172" cy="84" r="4" class="ok"/><circle cx="186" cy="84" r="4" class="ok"/><circle cx="200" cy="84" r="4" class="ok"/><path class="wire" d="M 216 97 C 250 97, 256 210, 306 210"/><path class="wireA flow" d="M 216 97 C 250 97, 256 210, 306 210" marker-end="url(#architecture-light-a-arrow)"/></g>
<g><rect x="36" y="178" width="180" height="66" rx="9" class="panel"/><text x="52" y="204" font-size="15">ModelScope</text><text x="52" y="225" font-size="12" class="mono muted">modelscope.cn</text><circle cx="172" cy="198" r="4" class="ok"/><circle cx="186" cy="198" r="4" class="ok"/><circle cx="200" cy="198" r="4" class="ok"/><path class="wire" d="M 216 211 C 250 211, 256 210, 306 210"/><path class="wireA flow" d="M 216 211 C 250 211, 256 210, 306 210" marker-end="url(#architecture-light-a-arrow)"/></g>
<g><rect x="36" y="292" width="180" height="66" rx="9" class="panel"/><text x="52" y="318" font-size="15">Gitee 镜像</text><text x="52" y="339" font-size="12" class="mono muted">hf-models org</text><circle cx="172" cy="312" r="4" class="ok"/><circle cx="186" cy="312" r="4" class="ok"/><circle cx="200" cy="312" r="4" class="ok"/><path class="wire" d="M 216 325 C 250 325, 256 210, 306 210"/><path class="wireA flow" d="M 216 325 C 250 325, 256 210, 306 210" marker-end="url(#architecture-light-a-arrow)"/></g>
<rect x="330" y="44" width="360" height="356" rx="12" class="panel" stroke-opacity=".9"/>
<text x="510" y="76" text-anchor="middle" font-size="17" font-weight="600">weightcanary — 单进程静态二进制</text>
<g><rect x="356" y="96" width="308" height="48" rx="9" class="panelKey" /><text x="374" y="116" font-size="14" class="mono">poller</text><text x="374" y="134" font-size="12" class="muted">三站 API 快照 · size + lfs sha256</text><text x="648" y="125" text-anchor="end" font-size="11" class="mono ok">m1</text></g>
<g><rect x="356" y="156" width="308" height="48" rx="9" class="panelKey" /><text x="374" y="176" font-size="14" class="mono">state</text><text x="374" y="194" font-size="12" class="muted">state.json 快照账本</text><text x="648" y="185" text-anchor="end" font-size="11" class="mono ok">m1</text></g>
<g><rect x="356" y="216" width="308" height="48" rx="9" class="panelKey" /><text x="374" y="236" font-size="14" class="mono">report</text><text x="374" y="254" font-size="12" class="muted">终端可用性报告</text><text x="648" y="245" text-anchor="end" font-size="11" class="mono ok">m1</text></g>
<g><rect x="356" y="276" width="308" height="48" rx="9" class="panel" stroke-dasharray="6 4"/><text x="374" y="296" font-size="14" class="mono">diff</text><text x="374" y="314" font-size="12" class="muted">逐轮对比 · 告警去重</text><text x="648" y="305" text-anchor="end" font-size="11" class="mono muted">m2</text></g>
<g><rect x="356" y="336" width="308" height="48" rx="9" class="panel" stroke-dasharray="6 4"/><text x="374" y="356" font-size="14" class="mono">notify</text><text x="374" y="374" font-size="12" class="muted">飞书 / 钉钉 / Webhook</text><text x="648" y="365" text-anchor="end" font-size="11" class="mono muted">m2</text></g>
<path class="wire" d="M 690 120 C 730 120, 736 120, 766 120"/><path class="wireA flow2" d="M 690 120 C 730 120, 736 120, 766 120" marker-end="url(#architecture-light-a-arrow)"/>
<g><rect x="770" y="82" width="200" height="76" rx="9" class="panelKey"/><text x="786" y="108" class="mono" font-size="14">state.json</text><text x="786" y="128" font-size="12" class="muted">文件清单 · size · sha256</text><text x="786" y="147" font-size="12" class="muted">逐模型 × 逐 registry</text></g>
<path class="wire" d="M 870 158 C 870 190, 700 236, 870 262" marker-end="url(#architecture-light-a-arrow)"/>
<g><rect x="770" y="266" width="200" height="92" rx="9" class="panel"/><text x="786" y="292" class="mono" font-size="13">$ weightcanary watch</text><text x="786" y="313" font-size="12" class="muted">hf ok · 177 files · 641 GiB</text><text x="786" y="331" font-size="12" class="muted">ms ok · in sync</text><text x="786" y="349" font-size="12" fill="#3c7d83">git 历史 = 审计账本</text></g>
<circle r="3" class="ok"><animateMotion dur="3.4s" repeatCount="indefinite" path="M 216 97 C 250 97, 256 210, 306 210"/></circle>
<circle r="3" class="warn"><animateMotion dur="4.1s" begin="1.2s" repeatCount="indefinite" path="M 216 211 C 250 211, 256 210, 306 210"/></circle>
<circle r="3" class="ok"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite" path="M 216 325 C 250 325, 256 210, 306 210"/></circle>
<text x="36" y="414" font-size="12" class="muted">实线 = m1 已实现 · 虚线 = m2 规划（对比与告警）</text>
</svg>