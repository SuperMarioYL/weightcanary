# Scheduled watch: refreshes the availability ledger (state.json) so git
# history records what was available and when. Commit your models.yaml first
# (git add -f models.yaml — it is gitignored by default). Alert routing
# (Feishu/DingTalk/webhook) lands with the change-detection milestone; until
# then this workflow keeps the ledger fresh and git diff shows what moved.
name: watch
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go build -o weightcanary .
      - run: ./weightcanary watch --config models.yaml --state state.json
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      - run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: refresh availability ledger"
          git push
