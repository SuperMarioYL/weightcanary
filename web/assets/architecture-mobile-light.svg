<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="architecture-mobile-light-title architecture-mobile-light-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="architecture-mobile-light-title">WeightCanary 架构</title><desc id="architecture-mobile-light-desc">三个 registry 源进入单进程二进制的 poller/state/report；diff 与 notify 属于 m2。</desc>
<defs><linearGradient id="architecture-mobile-light-b-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#31825c"/><stop offset=".5" stop-color="#3c7d83"/><stop offset="1" stop-color="#577c5e"/></linearGradient>
<radialGradient id="architecture-mobile-light-b-haze"><stop stop-color="#31825c" stop-opacity=".14"/><stop offset="1" stop-color="#f9fefc" stop-opacity="0"/></radialGradient>
<filter id="architecture-mobile-light-b-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="architecture-mobile-light-b-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7e3" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="architecture-mobile-light-b-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#3c7d83" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#132a26}.muted{fill:#557a7a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#architecture-mobile-light-b-neon)}.panel{fill:#f7fefa;stroke:#cbf7e3;stroke-width:1}.panelKey{fill:#f7fefa;stroke:#31825c;stroke-width:1.2}.wire{fill:none;stroke:#cbf7e3;stroke-width:1.2}.wireA{fill:none;stroke:url(#architecture-mobile-light-b-neon);stroke-width:1.6}.flow{fill:none;stroke:#31825c;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#3c7d83;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#31825c}.warn{fill:#3c7d83}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="640" height="520" fill="#f9fefc"/><rect width="640" height="520" fill="url(#architecture-mobile-light-b-grid)"/>
<text x="24" y="34" font-size="17" font-weight="600">weightcanary — 单进程静态二进制</text>
<g><rect x="24" y="52" width="592" height="42" rx="8" class="panel"/><text x="40" y="79" font-size="14">Hugging Face</text><text x="150" y="79" font-size="12" class="mono muted">huggingface.co</text><circle cx="560" cy="73" r="4" class="ok"/><circle cx="574" cy="73" r="4" class="ok"/><circle cx="588" cy="73" r="4" class="ok"/></g><g><rect x="24" y="104" width="592" height="42" rx="8" class="panel"/><text x="40" y="131" font-size="14">ModelScope</text><text x="150" y="131" font-size="12" class="mono muted">modelscope.cn</text><circle cx="560" cy="125" r="4" class="ok"/><circle cx="574" cy="125" r="4" class="ok"/><circle cx="588" cy="125" r="4" class="ok"/></g><g><rect x="24" y="156" width="592" height="42" rx="8" class="panel"/><text x="40" y="183" font-size="14">Gitee 镜像</text><text x="150" y="183" font-size="12" class="mono muted">hf-models org</text><circle cx="560" cy="177" r="4" class="ok"/><circle cx="574" cy="177" r="4" class="ok"/><circle cx="588" cy="177" r="4" class="ok"/></g>
<path class="wire" d="M 320 206 V 240" marker-end="url(#architecture-mobile-light-b-arrow)"/>
<g><rect x="24" y="254" width="592" height="42" rx="8" class="panelKey" /><text x="40" y="272" font-size="13" class="mono">poller</text><text x="120" y="272" font-size="12" class="muted">三站 API 快照 · size + lfs sha256</text><text x="600" y="281" text-anchor="end" font-size="11" class="mono ok">m1</text></g><g><rect x="24" y="304" width="592" height="42" rx="8" class="panelKey" /><text x="40" y="322" font-size="13" class="mono">state</text><text x="120" y="322" font-size="12" class="muted">state.json 快照账本</text><text x="600" y="331" text-anchor="end" font-size="11" class="mono ok">m1</text></g><g><rect x="24" y="354" width="592" height="42" rx="8" class="panelKey" /><text x="40" y="372" font-size="13" class="mono">report</text><text x="120" y="372" font-size="12" class="muted">终端可用性报告</text><text x="600" y="381" text-anchor="end" font-size="11" class="mono ok">m1</text></g><g><rect x="24" y="404" width="592" height="42" rx="8" class="panel" stroke-dasharray="6 4"/><text x="40" y="422" font-size="13" class="mono">diff</text><text x="120" y="422" font-size="12" class="muted">逐轮对比 · 去重告警</text><text x="600" y="431" text-anchor="end" font-size="11" class="mono muted">m2</text></g><g><rect x="24" y="454" width="592" height="42" rx="8" class="panel" stroke-dasharray="6 4"/><text x="40" y="472" font-size="13" class="mono">notify</text><text x="120" y="472" font-size="12" class="muted">飞书 / 钉钉 / Webhook</text><text x="600" y="481" text-anchor="end" font-size="11" class="mono muted">m2</text></g>
<text x="24" y="512" font-size="12" class="muted">state.json 提交进 git — 历史即审计账本 <tspan class="mono" fill="#557a7a">· 实线 m1 / 虚线 m2</tspan></text>
</svg>