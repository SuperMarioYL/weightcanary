<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="hero-light-title hero-light-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="hero-light-title">WeightCanary 品牌主视觉</title><desc id="hero-light-desc">一只金丝雀落在监控线上：盯守 Hugging Face 与 ModelScope/Gitee 镜像的权重可用性。</desc>
