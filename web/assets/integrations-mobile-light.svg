<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="integrations-mobile-light-title integrations-mobile-light-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="integrations-mobile-light-title">WeightCanary 能力与集成</title><desc id="integrations-mobile-light-desc">中心 watch 拉取三个 registry，外圈虚线是 m2 的告警路由。</desc>
<defs><linearGradient id="integrations-mobile-light-f-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#31825c"/><stop offset=".5" stop-color="#3c7d83"/><stop offset="1" stop-color="#577c5e"/></linearGradient>
<radialGradient id="integrations-mobile-light-f-haze"><stop stop-color="#31825c" stop-opacity=".14"/><stop offset="1" stop-color="#f9fefc" stop-opacity="0"/></radialGradient>
<filter id="integrations-mobile-light-f-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="integrations-mobile-light-f-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7e3" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="integrations-mobile-light-f-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#3c7d83" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#132a26}.muted{fill:#557a7a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#integrations-mobile-light-f-neon)}.panel{fill:#f7fefa;stroke:#cbf7e3;stroke-width:1}.panelKey{fill:#f7fefa;stroke:#31825c;stroke-width:1.2}.wire{fill:none;stroke:#cbf7e3;stroke-width:1.2}.wireA{fill:none;stroke:url(#integrations-mobile-light-f-neon);stroke-width:1.6}.flow{fill:none;stroke:#31825c;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#3c7d83;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#31825c}.warn{fill:#3c7d83}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="640" height="520" fill="#f9fefc"/><rect width="640" height="520" fill="url(#integrations-mobile-light-f-grid)"/>
<circle cx="320" cy="240" r="132" fill="none" stroke="#31825c" stroke-width="1.1" stroke-opacity=".5"/>
<circle cx="320" cy="240" r="205" fill="none" stroke="#557a7a" stroke-width="1" stroke-dasharray="7 7" class="spin" stroke-opacity=".55"/>
<path class="wire" d="M 320 240 L 452 240" stroke-opacity=".55"/><path class="wire" d="M 320 240 L 254.00000000000003 354.3153532995459" stroke-opacity=".55"/><path class="wire" d="M 320 240 L 253.99999999999994 125.68464670045412" stroke-opacity=".55"/>
<g><rect x="394.36" y="225" width="115.27999999999999" height="30" rx="15" class="panelKey" /><text x="452" y="244.5" text-anchor="middle" font-size="12" >Hugging Face</text></g><g><rect x="203.80000000000004" y="339.3153532995459" width="100.39999999999999" height="30" rx="15" class="panelKey" /><text x="254.00000000000003" y="358.8153532995459" text-anchor="middle" font-size="12" >ModelScope</text></g><g><rect x="222.39999999999995" y="110.68464670045412" width="63.199999999999996" height="30" rx="15" class="panelKey" /><text x="253.99999999999994" y="130.18464670045412" text-anchor="middle" font-size="12" >Gitee</text></g>
<g><rect x="397.5" y="47.46479222419009" width="50" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="422.5" y="66.96479222419009" text-anchor="middle" font-size="12" class="muted">飞书</text></g><g><rect x="487.63698726111124" y="295.1141293817621" width="50" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="512.6369872611112" y="314.6141293817621" text-anchor="middle" font-size="12" class="muted">钉钉</text></g><g><rect x="245.36212357827932" y="426.88558936750263" width="78.07999999999998" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="284.4021235782793" y="446.38558936750263" text-anchor="middle" font-size="12" class="muted">Webhook</text></g><g><rect x="49.920000000000016" y="225.00000000000003" width="130.15999999999997" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="115" y="244.50000000000003" text-anchor="middle" font-size="12" class="muted">GitHub Actions</text></g>
<circle r="3" class="ok"><animateMotion dur="3.0s" begin="0.0s" repeatCount="indefinite" path="M 320 240 L 452 240"/></circle><circle r="3" class="ok"><animateMotion dur="3.5s" begin="0.7s" repeatCount="indefinite" path="M 320 240 L 254.00000000000003 354.3153532995459"/></circle><circle r="3" class="ok"><animateMotion dur="4.0s" begin="1.4s" repeatCount="indefinite" path="M 320 240 L 253.99999999999994 125.68464670045412"/></circle>
<circle cx="320" cy="240" r="52" fill="#f7fefa" stroke="url(#integrations-mobile-light-f-neon)" stroke-width="2" filter="url(#integrations-mobile-light-f-glow)"/>
<text x="320" y="238" text-anchor="middle" font-size="13" font-weight="700" class="neon">WeightCanary</text>
<text x="320" y="260" text-anchor="middle" font-size="11" class="mono muted">watch</text>
<text x="30" y="34" font-size="14" font-weight="600" class="muted">输入 models.yaml</text>
<text x="610" y="34" text-anchor="end" font-size="14" font-weight="600" class="muted">输出 state.json 账本</text>
<text x="24" y="466" font-size="12"><tspan class="ok">实线</tspan><tspan class="muted"> = m1 已实现（HF / ModelScope / Gitee 快照）</tspan></text>
<text x="24" y="486" font-size="12"><tspan class="muted">虚线 = m2 规划（飞书 / 钉钉 / Webhook 告警路由）</tspan></text>
</svg>