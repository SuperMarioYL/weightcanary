<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="integrations-dark-title integrations-dark-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="integrations-dark-title">WeightCanary 能力与集成</title><desc id="integrations-dark-desc">中心 watch 拉取三个 registry，外圈虚线是 m2 的告警路由。</desc>
<defs><linearGradient id="integrations-dark-6-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#56e6a3"/><stop offset=".5" stop-color="#6adee7"/><stop offset="1" stop-color="#acf6b9"/></linearGradient>
<radialGradient id="integrations-dark-6-haze"><stop stop-color="#56e6a3" stop-opacity=".14"/><stop offset="1" stop-color="#050c0f" stop-opacity="0"/></radialGradient>
<filter id="integrations-dark-6-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="integrations-dark-6-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c30" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="integrations-dark-6-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6adee7" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#eefdf1}.muted{fill:#95b9b7}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#integrations-dark-6-neon)}.panel{fill:#0c171b;stroke:#173c30;stroke-width:1}.panelKey{fill:#0c171b;stroke:#56e6a3;stroke-width:1.2}.wire{fill:none;stroke:#173c30;stroke-width:1.2}.wireA{fill:none;stroke:url(#integrations-dark-6-neon);stroke-width:1.6}.flow{fill:none;stroke:#56e6a3;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#6adee7;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#56e6a3}.warn{fill:#6adee7}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="1000" height="430" fill="#050c0f"/><rect width="1000" height="430" fill="url(#integrations-dark-6-grid)"/>
<circle cx="500" cy="215" r="138" fill="none" stroke="#56e6a3" stroke-width="1.1" stroke-opacity=".5"/>
<circle cx="500" cy="215" r="208" fill="none" stroke="#95b9b7" stroke-width="1" stroke-dasharray="7 7" class="spin" stroke-opacity=".55"/>
<path class="wire" d="M 500 215 L 500 77" stroke-opacity=".55"/><path class="wire" d="M 500 215 L 619.5115057222525 284" stroke-opacity=".55"/><path class="wire" d="M 500 215 L 380.48849427774746 284" stroke-opacity=".55"/>
<g><rect x="438.64" y="62" width="122.72000000000001" height="30" rx="15" class="panelKey" /><text x="500" y="81.5" text-anchor="middle" font-size="13" >Hugging Face</text></g><g><rect x="566.2115057222526" y="269" width="106.60000000000001" height="30" rx="15" class="panelKey" /><text x="619.5115057222525" y="288.5" text-anchor="middle" font-size="13" >ModelScope</text></g><g><rect x="347.3384942777475" y="269" width="66.30000000000001" height="30" rx="15" class="panelKey" /><text x="380.48849427774746" y="288.5" text-anchor="middle" font-size="13" >Gitee</text></g>
<g><rect x="326.9217895131981" y="52.92178951319809" width="52" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="352.9217895131981" y="72.42178951319809" text-anchor="middle" font-size="13" class="muted">飞书</text></g><g><rect x="621.0782104868019" y="52.92178951319812" width="52" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="647.0782104868019" y="72.42178951319812" text-anchor="middle" font-size="13" class="muted">钉钉</text></g><g><rect x="605.8682104868019" y="347.0782104868019" width="82.42000000000002" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="647.0782104868019" y="366.5782104868019" text-anchor="middle" font-size="13" class="muted">Webhook</text></g><g><rect x="283.5017895131981" y="347.07821048680194" width="138.84000000000003" height="30" rx="15" class="panel" stroke-dasharray="6 4"/><text x="352.9217895131981" y="366.57821048680194" text-anchor="middle" font-size="13" class="muted">GitHub Actions</text></g>
<circle r="3" class="ok"><animateMotion dur="3.0s" begin="0.0s" repeatCount="indefinite" path="M 500 215 L 500 77"/></circle><circle r="3" class="ok"><animateMotion dur="3.5s" begin="0.7s" repeatCount="indefinite" path="M 500 215 L 619.5115057222525 284"/></circle><circle r="3" class="ok"><animateMotion dur="4.0s" begin="1.4s" repeatCount="indefinite" path="M 500 215 L 380.48849427774746 284"/></circle>
<circle cx="500" cy="215" r="58" fill="#0c171b" stroke="url(#integrations-dark-6-neon)" stroke-width="2" filter="url(#integrations-dark-6-glow)"/>
<text x="500" y="213" text-anchor="middle" font-size="15" font-weight="700" class="neon">WeightCanary</text>
<text x="500" y="235" text-anchor="middle" font-size="11" class="mono muted">watch</text>
<text x="30" y="34" font-size="14" font-weight="600" class="muted">输入 models.yaml</text>
<text x="970" y="34" text-anchor="end" font-size="14" font-weight="600" class="muted">输出 state.json 账本</text>
<text x="30" y="412" font-size="12.5"><tspan class="ok">实线</tspan><tspan class="muted"> = m1 已实现 — Hugging Face / ModelScope / Gitee 快照与对比</tspan></text>
<text x="520" y="412" font-size="12.5"><tspan class="muted">虚线 = m2 规划 — 飞书 / 钉钉 / Webhook / 定时 Action 告警路由</tspan></text>
</svg>