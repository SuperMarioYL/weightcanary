<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="process-light-title process-light-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="process-light-title">WeightCanary 盯守流程</title><desc id="process-light-desc">models.yaml 到三站快照、state.json 账本与终端报告；git 历史即审计账本。</desc>
<defs><linearGradient id="process-light-c-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#31825c"/><stop offset=".5" stop-color="#3c7d83"/><stop offset="1" stop-color="#577c5e"/></linearGradient>
<radialGradient id="process-light-c-haze"><stop stop-color="#31825c" stop-opacity=".14"/><stop offset="1" stop-color="#f9fefc" stop-opacity="0"/></radialGradient>
<filter id="process-light-c-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="process-light-c-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7e3" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="process-light-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#3c7d83" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#132a26}.muted{fill:#557a7a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#process-light-c-neon)}.panel{fill:#f7fefa;stroke:#cbf7e3;stroke-width:1}.panelKey{fill:#f7fefa;stroke:#31825c;stroke-width:1.2}.wire{fill:none;stroke:#cbf7e3;stroke-width:1.2}.wireA{fill:none;stroke:url(#process-light-c-neon);stroke-width:1.6}.flow{fill:none;stroke:#31825c;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#3c7d83;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#31825c}.warn{fill:#3c7d83}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="1000" height="400" fill="#f9fefc"/><rect width="1000" height="430" fill="none"/>
<rect width="1000" height="400" fill="url(#process-light-c-grid)"/>
<g><rect x="30" y="40" width="200" height="92" rx="10" class="panel"/><text x="46" y="66" font-size="14" font-weight="600">1 · models.yaml</text><text x="46" y="78" class="mono" font-size="11.5" fill="#557a7a">models:</text><text x="46" y="96" class="mono" font-size="11.5" fill="#557a7a">  - deepseek-ai/…</text><text x="46" y="114" class="mono" font-size="11.5" fill="#557a7a">  - zai-org/GLM-4.5</text></g>
<g><rect x="270" y="40" width="200" height="92" rx="10" class="panel"/><text x="286" y="66" font-size="14" font-weight="600">2 · poll 三站快照</text><circle cx="286" cy="84" r="4" class="ok"/><circle cx="300" cy="84" r="4" class="ok"/><circle cx="314" cy="84" r="4" class="ok"/><text x="286" y="112" font-size="11.5" class="muted">size + lfs sha256</text></g>
<g><rect x="510" y="40" width="210" height="92" rx="10" class="panel"/><text x="526" y="66" font-size="14" font-weight="600">3 · state.json 账本</text><text x="526" y="78" class="mono" font-size="11.5" fill="#557a7a">{ model_id, files }</text><text x="526" y="96" class="mono" font-size="11.5" fill="#557a7a">  size · lfs_sha256</text><text x="526" y="114" class="mono" font-size="11.5" fill="#557a7a">  commit_sha</text></g>
<g><rect x="760" y="40" width="210" height="92" rx="10" class="panel"/><text x="776" y="66" font-size="14" font-weight="600">4 · 终端报告</text><text x="776" y="78" class="mono" font-size="11.5" fill="#557a7a">hf ok · 177 files</text><text x="776" y="96" class="mono" font-size="11.5" fill="#557a7a">ms ok · in sync</text><text x="776" y="114" class="mono" font-size="11.5" fill="#3c7d83">gitee · divergent</text></g>
<path class="wire" d="M 230 86 H 266"/><path class="wireA flow" d="M 230 86 H 266" marker-end="url(#process-light-c-arrow)"/><path class="wire" d="M 470 86 H 506"/><path class="wireA flow" d="M 470 86 H 506" marker-end="url(#process-light-c-arrow)"/><path class="wire" d="M 720 86 H 756"/><path class="wireA flow" d="M 720 86 H 756" marker-end="url(#process-light-c-arrow)"/>
<g><rect x="30" y="182" width="940" height="192" rx="10" class="panel" stroke="#31825c" stroke-opacity=".5"/>
<text x="46" y="212" font-size="15" font-weight="600">git 历史 = 审计账本 — 提交每次 watch 的快照</text>
<circle cx="70" cy="242" r="5" class="ok"/><text x="70" y="264" text-anchor="middle" font-size="10.5" class="mono muted">run 1</text><circle cx="160" cy="242" r="5" class="ok"/><text x="160" y="264" text-anchor="middle" font-size="10.5" class="mono muted">run 2</text><circle cx="250" cy="242" r="5" class="ok"/><text x="250" y="264" text-anchor="middle" font-size="10.5" class="mono muted">run 3</text><circle cx="340" cy="242" r="5" class="warn glimmer"/><text x="340" y="264" text-anchor="middle" font-size="10.5" class="mono muted">run 4</text><circle cx="430" cy="242" r="5" class="ok"/><text x="430" y="264" text-anchor="middle" font-size="10.5" class="mono muted">run 5</text>
<text x="546" y="246" font-size="12" class="muted">每轮落一份快照；谁动了权重、何时动的，翻历史就有。</text>
<text x="46" y="300" class="mono" font-size="11.5" fill="#132a26">model-00001-of-000163.safetensors</text><circle cx="360" cy="296" r="4" class="ok"/><text x="376" y="300" font-size="11.5" fill="#557a7a">present</text><text x="46" y="318" class="mono" font-size="11.5" fill="#132a26">model-00002-of-000163.safetensors</text><circle cx="360" cy="314" r="4" class="ok"/><text x="376" y="318" font-size="11.5" fill="#557a7a">present</text><text x="46" y="336" class="mono" font-size="11.5" fill="#132a26">tokenizer.json</text><circle cx="360" cy="332" r="4" class="ok"/><text x="376" y="336" font-size="11.5" fill="#557a7a">present</text><text x="46" y="354" class="mono" font-size="11.5" fill="#3c7d83">was-here.safetensors</text><circle cx="360" cy="350" r="4" class="warn glimmer"/><text x="376" y="354" font-size="11.5" fill="#3c7d83">absent（本轮）</text>
<text x="500" y="318" font-size="12" class="muted">没变的文件保持安静；</text>
<text x="500" y="338" font-size="12" class="muted">逐轮自动对比与告警（飞书 / 钉钉）在 m2 落地。</text>
</g>
</svg>