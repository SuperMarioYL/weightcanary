<path d="M -34 6 Q -12 -6 8 2 Q -12 13 -34 6 Z" fill="none" stroke="#6adee7" stroke-width="1.8"/>
<circle cx="26" cy="-14" r="3.4" fill="#eefdf1"/>
<circle cx="26" cy="-14" r="6.5" fill="none" stroke="#acf6b9" stroke-width="1" opacity=".7" class="glimmer"/>
<path d="M -30 30 L -35 62 M -14 31 L -16 62" stroke="#95b9b7" stroke-width="1.6"/>
</g><text x="320" y="240" text-anchor="middle" font-size="46" font-weight="700" class="neon">WeightCanary</text><text x="320" y="275" text-anchor="middle" font-size="17" class="muted">权重的可用性，断供之前先知道</text><g><rect x="100" y="318" width="130" height="30" rx="15" fill="#0c171b" stroke="#173c30" stroke-width="1"/><text x="165" y="338" text-anchor="middle" font-size="13" class="" >Hugging Face</text></g><g><rect x="340" y="318" width="200" height="30" rx="15" fill="#0c171b" stroke="#173c30" stroke-width="1"/><text x="440" y="338" text-anchor="middle" font-size="13" class="" >ModelScope · Gitee</text></g><g><rect x="100" y="358" width="130" height="30" rx="15" fill="#0c171b" stroke="#173c30" stroke-width="1"/><text x="165" y="378" text-anchor="middle" font-size="13" class="mono" fill="#95b9b7">state.json 账本</text></g><g><rect x="340" y="358" width="200" height="30" rx="15" fill="#0c171b" stroke="#173c30" stroke-width="1"/><text x="440" y="378" text-anchor="middle" font-size="13" class="mono" fill="#95b9b7">watch · report</text></g>
<text x="622" y="416" text-anchor="end" font-size="11" class="mono muted">watch → snapshot → ledger → report</text>
</svg>