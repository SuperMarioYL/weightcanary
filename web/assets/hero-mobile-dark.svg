<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="hero-mobile-dark-title hero-mobile-dark-desc" data-palette="56e6a3-6adee7-acf6b9-561347e4092b">
<title id="hero-mobile-dark-title">WeightCanary 品牌主视觉</title><desc id="hero-mobile-dark-desc">一只金丝雀落在监控线上：盯守 Hugging Face 与 ModelScope/Gitee 镜像的权重可用性。</desc>
<defs><linearGradient id="hero-mobile-dark-1-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#56e6a3"/><stop offset=".5" stop-color="#6adee7"/><stop offset="1" stop-color="#acf6b9"/></linearGradient>
<radialGradient id="hero-mobile-dark-1-haze"><stop stop-color="#56e6a3" stop-opacity=".14"/><stop offset="1" stop-color="#050c0f" stop-opacity="0"/></radialGradient>
<filter id="hero-mobile-dark-1-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
<pattern id="hero-mobile-dark-1-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#173c30" stroke-opacity=".38" stroke-width=".6"/></pattern>
<marker id="hero-mobile-dark-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6adee7" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC',Arial,sans-serif;fill:#eefdf1}.muted{fill:#95b9b7}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.neon{fill:url(#hero-mobile-dark-1-neon)}.panel{fill:#0c171b;stroke:#173c30;stroke-width:1}.panelKey{fill:#0c171b;stroke:#56e6a3;stroke-width:1.2}.wire{fill:none;stroke:#173c30;stroke-width:1.2}.wireA{fill:none;stroke:url(#hero-mobile-dark-1-neon);stroke-width:1.6}.flow{fill:none;stroke:#56e6a3;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 5s linear infinite}.flow2{fill:none;stroke:#6adee7;stroke-width:2;stroke-dasharray:10 190;animation:wc-flow 6.5s linear infinite 1.2s}.glimmer{animation:wc-glim 5.5s ease-in-out infinite}.glimmer2{animation:wc-glim 7s ease-in-out infinite 1.4s}.drift{animation:wc-drift 4.2s ease-in-out infinite alternate}.spin{animation:wc-spin 60s linear infinite;transform-box:fill-box;transform-origin:center}.ok{fill:#56e6a3}.warn{fill:#6adee7}@keyframes wc-flow{to{stroke-dashoffset:-400}}@keyframes wc-glim{0%,100%{opacity:.35}45%,60%{opacity:1}}@keyframes wc-drift{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}@keyframes wc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.flow,.flow2,.glimmer,.glimmer2,.drift,.spin{animation:none}}</style>
<rect width="640" height="430" fill="#050c0f"/><rect width="640" height="430" fill="url(#hero-mobile-dark-1-grid)"/><rect x="180" y="0" width="460" height="430" fill="url(#hero-mobile-dark-1-haze)"/>
<circle cx="60" cy="60" r="3" fill="#6adee7" opacity=".7" class="drift" style="animation-delay:0.0s"/><circle cx="560" cy="80" r="2" fill="#56e6a3" opacity=".7" class="drift" style="animation-delay:0.4s"/><circle cx="80" cy="200" r="2" fill="#6adee7" opacity=".7" class="drift" style="animation-delay:0.8s"/><circle cx="580" cy="210" r="3" fill="#56e6a3" opacity=".7" class="drift" style="animation-delay:1.2s"/><circle cx="300" cy="40" r="2" fill="#6adee7" opacity=".7" class="drift" style="animation-delay:1.6s"/><circle cx="380" cy="386" r="2" fill="#56e6a3" opacity=".7" class="drift" style="animation-delay:2.0s"/><g transform="translate(320 120) scale(0.9)">
